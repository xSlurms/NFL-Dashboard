[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `npm run dev`: Netlify serves the functions on :8888 and proxies everything else to Vite.
[dev]
  framework = "#custom"
  command = "npx vite --port 5173 --strictPort"
  targetPort = 5173
  port = 8888

# Private personal page: no indexing and no framing. The Content-Security-Policy is a <meta> tag that
# vite.config.ts adds to production builds only, because Vite's dev server needs inline scripts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
