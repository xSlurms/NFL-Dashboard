[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `npm run dev`: Netlify serves the functions on :8888 and proxies everything else to Vite.
[dev]
  framework = "#custom"
  command = "npx vite --port 5173 --strictPort"
  targetPort = 5173
  port = 8888
